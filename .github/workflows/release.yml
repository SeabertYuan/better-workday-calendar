name: Release extensions

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build extension packages
        run: npm run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            for archive in dist/*.zip; do
              asset_name="${archive##*/}"
              if printf '%s\n' "$existing_assets" | grep -Fxq "$asset_name"; then
                echo "Keeping existing release asset $asset_name."
              else
                gh release upload "$GITHUB_REF_NAME" "$archive"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --verify-tag \
              --generate-notes \
              --title "Better Workday Calendar $GITHUB_REF_NAME"
          fi
